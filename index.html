<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Tools</title>
<style>
/* ═══ Design tokens ═══════════════════════════════════════════════════════
   Same vocabulary as the Compliance tool, so the hub and the tools it opens
   read as one system. Light is the default; [data-theme="dark"] swaps the
   ramp and nothing else.                                                   */
:root {
  --surface:        #f6f7f9;
  --surface-1:      #ffffff;
  --surface-2:      #f0f2f5;
  --surface-3:      #e6e9ef;
  --border:         #dfe3ea;
  --border-strong:  #c6ccd8;
  --text:           #1a1d24;
  --text-2:         #4a5160;
  --text-3:         #7b8496;
  --accent:         #2d5bd7;
  --accent-soft:    #e8eefc;
  --accent-text:    #ffffff;
  --shadow:         0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.04);
  --shadow-pop:     0 8px 28px rgba(16,24,40,.14);
  --radius:         10px;
  --radius-sm:      7px;
}
[data-theme="dark"] {
  --surface:        #0d0f17;
  --surface-1:      #161926;
  --surface-2:      #1a1d2e;
  --surface-3:      #252a40;
  --border:         #252a40;
  --border-strong:  #333a55;
  --text:           #dde1f0;
  --text-2:         #9ba3c4;
  --text-3:         #6b7499;
  --accent:         #4f6ef7;
  --accent-soft:    #1c2547;
  --accent-text:    #ffffff;
  --shadow:         0 1px 2px rgba(0,0,0,.4);
  --shadow-pop:     0 10px 34px rgba(0,0,0,.55);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--surface);
  color: var(--text);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ═══ App bar ═══ */
.appbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px;
  padding: 14px 24px;
  background: var(--surface-1);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.brand { display: flex; align-items: center; gap: 11px; color: var(--accent); }
.brand h1 {
  margin: 0; font-size: 17px; font-weight: 650;
  letter-spacing: -.01em; color: var(--text);
}
.icon-btn {
  appearance: none; cursor: pointer;
  width: 34px; height: 34px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 16px; line-height: 1;
  color: var(--text-2);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  transition: background .15s, color .15s, border-color .15s;
}
.icon-btn:hover { background: var(--surface-3); color: var(--text); border-color: var(--border-strong); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ═══ Page ═══ */
.wrap { max-width: 1080px; margin: 0 auto; padding: 40px 24px 64px; }
.lede { margin: 0 0 32px; max-width: 62ch; }
.lede h2 { margin: 0 0 8px; font-size: 26px; font-weight: 650; letter-spacing: -.02em; }
.lede p  { margin: 0; color: var(--text-2); }

/* ═══ Tool cards ═══ */
.grid {
  display: grid; gap: 18px;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
}
.card {
  display: flex; flex-direction: column;
  padding: 22px;
  text-decoration: none; color: inherit;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  transition: transform .15s, box-shadow .15s, border-color .15s;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-pop);
  border-color: var(--border-strong);
}
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.card-icon {
  width: 40px; height: 40px; margin-bottom: 14px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 20px;
  background: var(--accent-soft); color: var(--accent);
  border-radius: var(--radius-sm);
}
.card h3 { margin: 0 0 7px; font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
.card p  { margin: 0 0 16px; color: var(--text-2); font-size: 14px; }
.card-feed {
  margin-top: auto;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  font-size: 12.5px; color: var(--text-3);
}
.card-feed strong { color: var(--text-2); font-weight: 600; }
.card-open {
  margin-top: 12px;
  font-size: 13px; font-weight: 600; color: var(--accent);
}
.card-open::after { content: " \2192"; }

footer {
  margin-top: 44px; padding-top: 20px;
  border-top: 1px solid var(--border);
  font-size: 13px; color: var(--text-3);
}

@media (max-width: 560px) {
  .appbar { padding: 12px 16px; }
  .wrap { padding: 28px 16px 48px; }
  .lede h2 { font-size: 22px; }
}
</style>
</head>
<body>

<div class="appbar">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 38 38" aria-hidden="true"><path fill="currentColor" d="M35.4544465,9.4999895c-1.6675854-2.8883456-4.0661211-5.2869461-6.9544707-6.9545288C25.6116245.8778901,22.3351164-.0000113,18.9999602-.0000113s-6.6116643.8779014-9.500013,2.5454718c-2.8883495,1.6675829-5.2868861,4.0661834-6.9544579,6.954529C.8779042,12.3883351.0000007,15.6648388.0000007,18.9999905s.8779036,6.6116553,2.5454887,9.4999991c1.6675717,2.8883438,4.0661088,5.2869456,6.9544579,6.9545142,2.8883495,1.6675832,6.1648567,2.545485,9.500013,2.545485s6.6116643-.8779018,9.5000139-2.545485c2.8883514-1.6675685,5.2868871-4.0661704,6.9544725-6.954516,1.6676402-2.8883456,2.5455542-6.1648474,2.5455542-9.5000009s-.8779834-6.6116553-2.5455542-9.4999973ZM1.8999571,18.9999905c0-3.0017169.7901239-5.9505479,2.290984-8.5499634,1.5007929-2.5995498,3.6594907-4.7581912,6.259044-6.2591026,2.444813-1.4115102,5.19865-2.1943806,8.0147432-2.2824819l-2.1816223,15.5229389L3.9306169,27.082194c-1.331722-2.4829084-2.0306614-5.2591831-2.0306598-8.0822035ZM27.550001,33.8090561c-2.5995542,1.5007927-5.5483874,2.2908612-8.5500426,2.2908612s-5.9504747-.7900685-8.5499741-2.2908612c-2.444813-1.4115093-4.499631-3.4050629-5.984056-5.7997344l14.5340301-5.872124,14.5341123,5.872124c-1.4844378,2.3946733-3.5392558,4.3882251-5.9840697,5.7997344ZM34.0693811,27.0821921l-12.3525704-9.6508126-2.1816059-15.5229372c2.8161461.0881012,5.569986.8709716,8.014798,2.282482,2.5994866,1.5009119,4.7581991,3.6595529,6.2589902,6.2591026,1.5008605,2.5994155,2.2909849,5.5483799,2.2909849,8.5499634,0,2.8230204-.6989524,5.5992951-2.0305968,8.0822017Z"/></svg>
    <h1>Admin Tools</h1>
  </div>
  <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Switch between light and dark">&#9788;</button>
</div>

<div class="wrap">
  <div class="lede">
    <h2>Technical Training admin tools</h2>
    <p>Pick a tool below. Every one of them runs entirely in your browser &mdash;
       the spreadsheet you load never leaves your machine and nothing is uploaded
       anywhere.</p>
  </div>

  <div class="grid" id="grid"></div>

  <footer id="footer"></footer>
</div>

<script>
/* ═══ The tool list ═══════════════════════════════════════════════════════
   To add a tool: drop its HTML file in this folder and add one entry here.
   No other change is needed — the grid builds itself from this array.
     icon  — a single emoji or character for the tile
     href  — relative filename, or a full URL for a tool hosted elsewhere
     feeds — what the user has to load into it, in plain words           */
const TOOLS = [
  {
    icon:  "\u{1F4CB}",
    title: "Technician Qualification Compliance",
    desc:  "Network-wide qualification picture: where each site stands, who is in the " +
           "pipeline, which courses are in demand and how the population breaks down.",
    feeds: "PDP Course Data and PDP Profile Data exports (.xlsx)",
    href:  "https://mbtraininguk.github.io/Technician-Qualification-Compliance-Tool/"
  },
  {
    icon:  "\u{1F514}",
    title: "T2397D Recertification",
    desc:  "Finds everyone overdue for their annual T2397D recertification, groups them " +
           "by site and drafts the chase email for each site, tracking who you have sent to.",
    feeds: "Excel tracker with the <strong>T2397D ReCertification List</strong> and " +
           "<strong>Active Profiles</strong> sheets",
    href:  "t2397d.html"
  },
  {
    icon:  "\u{26A1}",
    title: "T2722D Recertification",
    desc:  "Finds everyone overdue for their annual T2722D high-voltage and lithium-ion " +
           "battery safety training, groups them by site and drafts the chase email for " +
           "each site, tracking who you have sent to.",
    feeds: "Excel tracker with the <strong>T2722D ReCertification List</strong> and " +
           "<strong>Active Profiles</strong> sheets",
    href:  "t2722d.html"
  },
  {
    icon:  "\u{1F4CA}",
    title: "Weekly Course Numbers",
    desc:  "Turns the weekly course reports into a priority view and velocity analysis &mdash; " +
           "what needs attention now, what is at risk and how fast courses are filling.",
    feeds: "The week's course report exports (.xlsx), one or a whole folder at once",
    href:  "weekly-numbers.html"
  }
];

/* ═══ Build the grid ═══ */
document.getElementById("grid").innerHTML = TOOLS.map(function (t) {
  return '<a class="card" href="' + t.href + '">' +
           '<span class="card-icon" aria-hidden="true">' + t.icon + '</span>' +
           '<h3>' + t.title + '</h3>' +
           '<p>' + t.desc + '</p>' +
           '<div class="card-feed"><strong>Feed it:</strong> ' + t.feeds + '</div>' +
           '<div class="card-open">Open tool</div>' +
         '</a>';
}).join("");

document.getElementById("footer").textContent =
  TOOLS.length + " tools · Technical Training · " +
  "everything runs client-side, no data is sent anywhere";

/* ═══ Theme ═══════════════════════════════════════════════════════════════
   Stored under the same key the Compliance tool uses ('mbct-theme'). Both
   sit on mbtraininguk.github.io, so that is one origin and one localStorage:
   a preference set in either place carries across to the other. Light is the
   default with nothing saved, matching the Compliance tool exactly.        */
function applyTheme(mode) {
  if (mode === "dark") { document.documentElement.setAttribute("data-theme", "dark"); }
  else                 { document.documentElement.removeAttribute("data-theme"); }
  var btn = document.getElementById("themeBtn");
  if (btn) { btn.innerHTML = (mode === "dark") ? "&#9790;" : "&#9788;"; }
}
function toggleTheme() {
  var next = document.documentElement.hasAttribute("data-theme") ? "light" : "dark";
  try { localStorage.setItem('mbct-theme', next); } catch (e) {}
  applyTheme(next);
}
(function initTheme() {
  var saved = null;
  try { saved = localStorage.getItem('mbct-theme'); } catch (e) {}
  applyTheme(saved === 'dark' ? 'dark' : 'light');
})();
</script>

</body>
</html>
